name: Bug report
description: Something in First Flow does not work, looks wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. One problem per report, please.
        Before you attach a screenshot, crop or cover anything private. Issues here are public.
  - type: input
    id: version
    attributes:
      label: App version
      description: "In the app: Settings, About. Or Android settings, Apps, First Flow."
      placeholder: "1.0.26"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone, tablet or TV model
      description: Android settings, About phone.
      placeholder: Pixel 8
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Android settings, About phone, Android version.
      placeholder: "15"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: "Which screen or feature?"
      options:
        - "home (length, pace and begin)"
        - "pose of the day"
        - "the flow (get ready, hold, switch sides)"
        - "breath ring"
        - "done screen"
        - "reminder invite"
        - "poses list"
        - "a pose page"
        - "science"
        - "settings"
        - "look (follow the phone, blush, dusk or black)"
        - "breath pace"
        - "get ready time"
        - "sound (bowls, voice guide, music)"
        - "daily reminder"
        - "reminder notification"
        - "privacy page"
        - "help links"
        - "more (add the widget)"
        - "home screen widget"
        - "accessibility (talkback, large text)"
        - "tv: home and side rail"
        - "tv: the flow and remote keys"
        - "tv: poses"
        - "tv: settings sheets"
        - "tv: qr codes (open on your phone)"
        - "other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, one step per line.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshot or screen recording
      description: Drag the file in here. A short recording helps a lot with bugs in the flow.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open issues and this is not there yet.
          required: true
        - label: My screenshots show nothing private.
          required: true
